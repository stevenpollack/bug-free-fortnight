name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container: docker.io/catthehacker/ubuntu:act-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.clam.au
          username: ${{ vars.BUILDER_BOT }}
          password: ${{ secrets.BUILDER_BOT_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: git.clam.au/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=git.clam.au/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=git.clam.au/${{ github.repository }}:buildcache,mode=max

      - name: Update cluster deployment
        if: github.ref == 'refs/heads/main'
        env:
          FORGEJO_USERNAME: ${{ vars.BUILDER_BOT }}
          CLUSTER_REPO_TOKEN: ${{ secrets.BUILDER_BOT_TOKEN }}
          APP_NAME: ${{ github.event.repository.name }}
          IMAGE_REPO: ${{ github.repository }}
        run: |
          APP_NAME="${APP_NAME:-${GITHUB_REPOSITORY##*/}}"
          SHA_TAG="main-$(echo ${GITHUB_SHA} | cut -c1-7)"
          DEPLOY_FILE="apps-internal/${APP_NAME}/${APP_NAME}-main-deployment.yaml"

          git clone "https://${FORGEJO_USERNAME}:${CLUSTER_REPO_TOKEN}@git.clam.au/clamcloud/cluster.git" /tmp/cluster

          if [ ! -f "/tmp/cluster/${DEPLOY_FILE}" ]; then
            echo "ERROR: deployment file not found at ${DEPLOY_FILE}" >&2
            exit 1
          fi

          sed -i "s|image: git.clam.au/${IMAGE_REPO}:.*|image: git.clam.au/${IMAGE_REPO}:${SHA_TAG}|" \
            "/tmp/cluster/${DEPLOY_FILE}"
          cd /tmp/cluster
          git config user.email "builder@clam.au"
          git config user.name "Builder Bot"
          if ! git diff --quiet; then
            git commit -am "ci(${APP_NAME}): update image to ${SHA_TAG}"
            git push
          fi
